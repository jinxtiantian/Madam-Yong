<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="TP Tracker" />
  <title>TP Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #1a1a1a; }
    #app { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; padding: 0 0 32px; }

    .header { padding: 16px 16px 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fff; position: sticky; top: 0; z-index: 10; }
    .header-left h1 { font-size: 20px; font-weight: 600; }
    .header-left p { font-size: 12px; color: #666; margin-top: 2px; }

    .sync-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 500; }
    .sync-idle    { background: #EAF3DE; color: #3B6D11; }
    .sync-saving  { background: #FAEEDA; color: #854F0B; }
    .sync-loading { background: #E6F1FB; color: #185FA5; }
    .sync-error   { background: #FCEBEB; color: #A32D2D; }

    .tabs { display: flex; gap: 6px; padding: 12px 16px; flex-wrap: wrap; border-bottom: 1px solid #eee; background: #fff; }
    .tab { padding: 6px 12px; border-radius: 8px; font-size: 13px; border: 1px solid #ddd; background: transparent; color: #666; cursor: pointer; }
    .tab.active { background: #EBF5FF; color: #1a6fb5; border-color: transparent; font-weight: 500; }

    .content { padding: 14px 16px; }

    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
    .stat { background: #f5f5f5; border-radius: 10px; padding: 10px; text-align: center; }
    .stat-num { font-size: 22px; font-weight: 600; }
    .stat-lbl { font-size: 11px; color: #666; margin-top: 2px; }

    .prog-wrap { margin-bottom: 16px; }
    .prog-lbl { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 4px; }
    .prog-bar { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

    .section-label { font-size: 11px; color: #999; letter-spacing: 0.06em; margin-bottom: 8px; text-transform: uppercase; }

    .sk-card { background: #fff; border: 1px solid #eee; border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .sk-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; cursor: pointer; }
    .sk-title { font-size: 14px; font-weight: 600; flex: 1; }
    .sk-sub { font-size: 12px; color: #888; margin-top: 3px; }
    .chevron { font-size: 11px; color: #aaa; transition: transform 0.2s; display: inline-block; margin-top: 2px; }
    .chevron.open { transform: rotate(90deg); }

    .tp-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
    .tp-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
    .tp1 { background: #EAF3DE; color: #3B6D11; }
    .tp2 { background: #E6F1FB; color: #185FA5; }
    .tp3 { background: #FAEEDA; color: #854F0B; }
    .tp4 { background: #EEEDFE; color: #534AB7; }
    .tp5 { background: #FAECE7; color: #993C1D; }
    .tp6 { background: #FCEBEB; color: #A32D2D; }

    .sp-list { margin-top: 12px; border-top: 1px solid #f0f0f0; padding-top: 10px; display: none; }
    .sp-list.open { display: block; }
    .sp-item { padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
    .sp-item:last-child { border-bottom: none; }
    .sp-code { font-size: 11px; color: #999; font-family: monospace; }
    .sp-desc { font-size: 13px; font-weight: 500; margin: 3px 0; }
    .sp-cando { font-size: 12px; color: #666; font-style: italic; margin-bottom: 8px; }

    .rekod-btn { width: 100%; padding: 10px; border: 1.5px dashed #ddd; border-radius: 12px; background: transparent; color: #888; font-size: 13px; cursor: pointer; margin-top: 4px; }
    .rekod-btn:active { background: #f5f5f5; }

    /* Modal */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.45); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
    .modal { background: #fff; border-radius: 20px 20px 0 0; padding: 20px 16px; width: 100%; max-height: 88vh; overflow-y: auto; }
    .modal-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px; }
    .modal-sp-code { font-size: 11px; color: #999; font-family: monospace; }
    .modal-sp-title { font-size: 15px; font-weight: 600; margin: 4px 0; }
    .modal-sp-cando { font-size: 12px; color: #666; font-style: italic; }

    .student-row { padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
    .student-row:last-of-type { border-bottom: none; }
    .student-name { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .student-controls { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    .tp-sel { font-size: 13px; border: 1px solid #ddd; border-radius: 8px; padding: 5px 8px; background: #fff; flex: 1; }
    .date-inp { font-size: 12px; border: 1px solid #ddd; border-radius: 8px; padding: 5px 8px; background: #fff; flex: 1.2; }
    .evidence-inp { width: 100%; font-size: 12px; padding: 7px 10px; border: 1px solid #ddd; border-radius: 8px; background: #fff; }

    .close-btn { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; background: #f5f5f5; color: #333; font-size: 14px; cursor: pointer; margin-top: 14px; font-weight: 500; }

    .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; color: #666; font-size: 14px; }
    .spinner { width: 32px; height: 32px; border: 3px solid #eee; border-top-color: #378ADD; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Evidence media */
    .evidence-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
    .media-btn { display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 20px; border: 1px solid #ddd; background: #f9f9f9; font-size: 12px; color: #444; cursor: pointer; }
    .media-btn:active { background: #eee; }
    .media-thumb-wrap { position: relative; display: inline-block; }
    .media-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; display: block; }
    .media-del { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; background: #e24b4a; color: #fff; border-radius: 50%; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; line-height: 1; }
    .media-gallery { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .video-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid #eee; }
  </style>
</head>

// ── State ──────────────────────────────────────────────
let state = {
  activeSubject: "eng1",
  expandedSK: null,
  records: {},
  syncStatus: "loading",
  modal: null,
  saveTimer: null,
};

// ── Google Sheets API ──────────────────────────────────
function loadRecords() {
  setState({ syncStatus: "loading" });
  fetch(`${SCRIPT_URL}?action=getAll`)
    .then(r => r.json())
    .then(data => { if (!data.error) setState({ records: data }); setState({ syncStatus: "idle" }); render(); })
    .catch(() => setState({ syncStatus: "error", render: true }));
}

function saveRecord(key, value, subjectId) {
  clearTimeout(state.saveTimer);
  setState({ syncStatus: "saving" });
  const timer = setTimeout(() => {
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "save", key, ...value, subjectId }),
    })
      .then(r => r.json())
      .then(d => { setState({ syncStatus: d.success ? "idle" : "error" }); renderSyncBadge(); })
      .catch(() => { setState({ syncStatus: "error" }); renderSyncBadge(); });
  }, 800);
  setState({ saveTimer: timer });
}

// ── Helpers ────────────────────────────────────────────
function setState(patch) { Object.assign(state, patch); }

function getSub() { return DATA.subjects.find(s => s.id === state.activeSubject); }

function countMastered(subId, spCode) {
  const s = DATA.subjects.find(x => x.id === subId);
  if (!s) return 0;
  return s.students.filter(st => {
    const k = `${subId}__${spCode}__${st}`;
    return state.records[k]?.tp && state.records[k].tp !== "0";
  }).length;
}

function tpBadges(tp_range) {
  return tp_range.map(t => `<span class="tp-badge tp${t}">TP${t}</span>`).join("");
}

function syncBadgeHTML(status) {
  const map = { idle: ["sync-idle","Tersimpan ✓"], saving: ["sync-saving","Menyimpan…"], loading: ["sync-loading","Memuatkan…"], error: ["sync-error","Ralat ✗"] };
  const [cls, txt] = map[status] || map.idle;
  return `<span class="sync-badge ${cls}">${txt}</span>`;
}

function progBar(pct, color) {
  return `<div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${color}"></div></div>`;
}

// ── Render ─────────────────────────────────────────────
function renderSyncBadge() {
  document.querySelectorAll(".sync-badge-slot").forEach(el => { el.innerHTML = syncBadgeHTML(state.syncStatus); });
}

function render() {
  const sub = getSub();
  const total = sub.sks.reduce((a,sk) => a+sk.sps.length, 0);
  const mastered = sub.sks.reduce((a,sk) => a+sk.sps.reduce((b,sp) => b+countMastered(sub.id,sp.code),0),0);
  const pct = total > 0 ? Math.round(mastered/(total*sub.students.length)*100) : 0;

  let html = `
    <div class="header">
      <div class="header-left">
        <h1>TP Tracker</h1>
        <p>${sub.name} — ${sub.students.length} murid</p>
      </div>
      <span class="sync-badge-slot">${syncBadgeHTML(state.syncStatus)}</span>
    </div>
    <div class="tabs">
      ${DATA.subjects.map(s => `<button class="tab${s.id===state.activeSubject?" active":""}" onclick="switchSub('${s.id}')">${s.name}</button>`).join("")}
    </div>
    <div class="content">
      <div class="stats">
        <div class="stat"><div class="stat-num">${sub.students.length}</div><div class="stat-lbl">Murid</div></div>
        <div class="stat"><div class="stat-num">${sub.sks.length}</div><div class="stat-lbl">SK</div></div>
        <div class="stat"><div class="stat-num">${pct}%</div><div class="stat-lbl">Rekod</div></div>
      </div>
      <div class="prog-wrap">
        <div class="prog-lbl"><span>Kemajuan rekod</span><span>${mastered}/${total*sub.students.length}</span></div>
        ${progBar(pct,"#378ADD")}
      </div>
      <div class="section-label">Standard Kandungan</div>
      ${sub.sks.map(sk => {
        const key = `${sub.id}_${sk.code}`;
        const isOpen = state.expandedSK === key;
        return `
        <div class="sk-card">
          <div class="sk-header" onclick="toggleSK('${key}')">
            <div style="flex:1">
              <div class="sk-title">${sk.code} — ${sk.title}</div>
              <div class="sk-sub">${sk.sps.length} Standard Pembelajaran</div>
              <div class="tp-badges">${tpBadges(sk.tp_range)}</div>
            </div>
            <span class="chevron${isOpen?" open":""}">▶</span>
          </div>
          <div class="sp-list${isOpen?" open":""}">
            ${sk.sps.map(sp => {
              const m = countMastered(sub.id, sp.code);
              const spPct = Math.round(m/sub.students.length*100);
              return `
              <div class="sp-item">
                <div class="sp-code">${sp.code}</div>
                <div class="sp-desc">${sp.desc}</div>
                <div class="sp-cando">✓ ${sp.cando}</div>
                <div class="prog-wrap" style="margin-bottom:8px">
                  <div class="prog-lbl"><span>Penguasaan</span><span>${m}/${sub.students.length}</span></div>
                  ${progBar(spPct,"#1D9E75")}
                </div>
                <button class="rekod-btn" onclick="openModal('${sub.id}','${sk.code}','${sp.code}')">+ Rekod TP murid</button>
              </div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>`;

  document.getElementById("app").innerHTML = html;
  if (state.modal) renderModal();
}

function renderModal() {
  const { subId, skCode, spCode } = state.modal;
  const sub = DATA.subjects.find(s => s.id === subId);
  const sk = sub.sks.find(s => s.code === skCode);
  const sp = sk.sps.find(s => s.code === spCode);

  const rows = sub.students.map(student => {
    const key = `${subId}__${spCode}__${student}`;
    const rec = state.records[key] || {};
    return `
    <div class="student-row">
      <div class="student-name">${student}</div>
      <div class="student-controls">
        <select class="tp-sel" onchange="updateRecord('${key}','tp',this.value,'${subId}')">
          <option value="0"${(!rec.tp||rec.tp==="0")?" selected":""}>— TP</option>
          ${[1,2,3,4,5,6].map(n=>`<option value="${n}"${rec.tp===String(n)?" selected":""}>${"TP"+n}</option>`).join("")}
        </select>
        <input class="date-inp" type="date" value="${rec.date||""}" onchange="updateRecord('${key}','date',this.value,'${subId}')">
      </div>
      <input class="evidence-inp" type="text" placeholder="Catatan / nota…" value="${rec.evidence||\"\"}" onchange="updateRecord('${key}','evidence',this.value,'${subId}')">\n      <div class="evidence-row">\n        <label class="media-btn">📷 Foto<input type="file" accept="image/*" capture="environment" style="display:none" onchange="addMedia('${key}','${subId}',this)"></label>\n        <label class="media-btn">🎥 Video<input type="file" accept="video/*" capture="environment" style="display:none" onchange="addMedia('${key}','${subId}',this)"></label>\n        <label class="media-btn">🖼️ Galeri<input type="file" accept="image/*,video/*" multiple style="display:none" onchange="addMedia('${key}','${subId}',this)"></label>\n      </div>\n      <div class="media-gallery" id="gal_${key.replace(/[^a-z0-9]/gi,'_')}">${renderGallery(key)}</div>\n    </div>`;\n  }).join("");\n  }).join("");

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modal-overlay";
  overlay.onclick = e => { if (e.target === overlay) closeModal(); };
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span class="modal-sp-code">${sk.code} › ${sp.code}</span>
        <span class="sync-badge-slot">${syncBadgeHTML(state.syncStatus)}</span>
      </div>
      <div class="modal-sp-title">${sp.desc}</div>
      <div class="modal-sp-cando" style="margin:4px 0 8px">✓ ${sp.cando}</div>
      <div class="tp-badges" style="margin-bottom:12px">${tpBadges(sk.tp_range)}</div>
      ${rows}
      <button class="close-btn" onclick="closeModal()">Tutup</button>
    </div>`;
  document.body.appendChild(overlay);
}

// ── Actions ────────────────────────────────────────────
function switchSub(id) { setState({ activeSubject: id, expandedSK: null, modal: null }); render(); }
function toggleSK(key) { setState({ expandedSK: state.expandedSK === key ? null : key }); render(); }
function openModal(subId, skCode, spCode) { setState({ modal: { subId, skCode, spCode } }); render(); }
function closeModal() {
  const el = document.getElementById("modal-overlay");
  if (el) el.remove();
  setState({ modal: null });
}

function updateRecord(key, field, value, subjectId) {
  const rec = { ...(state.records[key] || {}), [field]: value };
  state.records[key] = rec;
  renderSyncBadge();
  saveRecord(key, rec, subjectId);
  // Update progress bars without full re-render
  render();
}


// ── Media / Evidence Photos ────────────────────────────
if (!window.mediaStore) window.mediaStore = {};

function renderGallery(key) {
  const items = window.mediaStore[key] || [];
  if (!items.length) return "";
  return items.map((item, idx) => {
    if (item.type === "video") {
      return `<div class="media-thumb-wrap"><video class="video-thumb" src="${item.src}" onclick="viewMedia('${item.src}','video')"></video><button class="media-del" onclick="deleteMedia('${key}',${idx})">&#x2715;</button></div>`;
    }
    return `<div class="media-thumb-wrap"><img class="media-thumb" src="${item.src}" onclick="viewMedia('${item.src}','image')"><button class="media-del" onclick="deleteMedia('${key}',${idx})">&#x2715;</button></div>`;
  }).join("");
}

function addMedia(key, subjectId, input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  if (!window.mediaStore[key]) window.mediaStore[key] = [];
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const isVideo = file.type.startsWith("video");
      window.mediaStore[key].push({ src: e.target.result, type: isVideo ? "video" : "image" });
      loaded++;
      if (loaded === files.length) {
        const safeKey = key.replace(/[^a-z0-9]/gi, "_");
        const galEl = document.getElementById("gal_" + safeKey);
        if (galEl) galEl.innerHTML = renderGallery(key);
        const rec = Object.assign({}, state.records[key] || {});
        const count = window.mediaStore[key].length;
        rec.evidence = (rec.evidence ? rec.evidence.replace(/ ?\[\d+ fail media\]/g,"").trim() + " " : "") + "[" + count + " fail media]";
        state.records[key] = rec;
        saveRecord(key, rec, subjectId);
      }
    };
    reader.readAsDataURL(file);
  });
  input.value = "";
}

function deleteMedia(key, idx) {
  if (window.mediaStore[key]) window.mediaStore[key].splice(idx, 1);
  const safeKey = key.replace(/[^a-z0-9]/gi, "_");
  const galEl = document.getElementById("gal_" + safeKey);
  if (galEl) galEl.innerHTML = renderGallery(key);
}

function viewMedia(src, type) {
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:200;display:flex;align-items:center;justify-content:center;";
  overlay.onclick = () => overlay.remove();
  if (type === "video") {
    overlay.innerHTML = "<video src=\"" + src + "\" controls autoplay style=\"max-width:95vw;max-height:90vh;border-radius:8px;\"></video>";
  } else {
    overlay.innerHTML = "<img src=\"" + src + "\" style=\"max-width:95vw;max-height:90vh;border-radius:8px;object-fit:contain;\">";
  }
  document.body.appendChild(overlay);
}

// ── Boot ───────────────────────────────────────────────
render();
loadRecords();

// ── Service Worker registration ────────────────────────
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
